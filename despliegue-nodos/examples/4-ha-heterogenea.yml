# Roles diferentes; sólo B/C/D almacenan PostgreSQL, A conserva acceso redundante.
version: 1
deployment: nodos-cuatro
profile: alta_disponibilidad
gateway: {preferred: equipo-a}
nodes:
  - id: equipo-a
    address: 192.168.50.11
    platform: fedora
    failure_domain: maquina-a
    resources: {cpus: 2, memory_mb: 2048}
    roles: [gateway, frontend, usuarios, compras]
    docker_subnet: 172.28.101.0/24
  - id: equipo-b
    address: 192.168.50.12
    platform: wsl2
    failure_domain: maquina-b
    resources: {cpus: 4, memory_mb: 4096}
    roles: [gateway, frontend, eventos, compras]
    docker_subnet: 172.28.102.0/24
  - id: equipo-c
    address: 192.168.50.13
    platform: fedora
    failure_domain: maquina-c
    resources: {cpus: 4, memory_mb: 4096}
    roles: [usuarios, eventos]
    docker_subnet: 172.28.103.0/24
  - id: equipo-d
    address: 192.168.50.14
    platform: fedora
    failure_domain: maquina-d
    resources: {cpus: 2, memory_mb: 2048}
    roles: []
    docker_subnet: 172.28.104.0/24
databases:
  usuarios: {primary: equipo-b, standbys: [equipo-c, equipo-d], replication: sync, sync_quorum: 1}
  eventos: {primary: equipo-c, standbys: [equipo-b, equipo-d], replication: sync, sync_quorum: 1}
  compras: {primary: equipo-d, standbys: [equipo-b, equipo-c], replication: sync, sync_quorum: 1}
