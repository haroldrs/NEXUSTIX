# Tres PC completas: cada una corre todos los servicios, vota y aloja la base
# principal de un servicio distinto, con réplicas síncronas en las otras dos.
# Más robusto que 2 PC + árbitro: si cae cualquiera, quedan DOS PC completas,
# cada base conserva una réplica y la carga se sigue repartiendo.
# Direcciones de ejemplo de Tailscale (100.x.y.z): reemplace por las reales.
version: 1
deployment: tres-pc-ha
release: ha-auto-v1
profile: alta_disponibilidad
gateway: {preferred: pc1}
applications:
  mirror_nodes: [pc1, pc2, pc3]
  replicas: {frontend: 3, gateway: 3, usuarios: 3, eventos: 3, compras: 3}
coordination:
  mode: patroni
  voters: [pc1, pc2, pc3]
nodes:
  - id: pc1
    address: 100.101.1.11
    platform: fedora
    failure_domain: maquina-1
    resources: {cpus: 4, memory_mb: 4096}
    roles: []
  - id: pc2
    address: 100.101.1.12   # IP Tailscale de Windows (Docker Desktop + WSL2).
    platform: wsl2
    failure_domain: maquina-2
    resources: {cpus: 4, memory_mb: 4096}
    roles: []
  - id: pc3
    address: 100.101.1.13
    platform: wsl2
    failure_domain: maquina-3
    resources: {cpus: 4, memory_mb: 4096}
    roles: []
databases:
  usuarios: {primary: pc1, standbys: [pc2, pc3], replication: sync, sync_quorum: 1}
  eventos:  {primary: pc2, standbys: [pc1, pc3], replication: sync, sync_quorum: 1}
  compras:  {primary: pc3, standbys: [pc1, pc2], replication: sync, sync_quorum: 1}
