    - checkpoint_timeout=5min
    - -c
    - archive_mode=on
    - -c
    - archive_timeout=60s
    - -c
    - archive_command=archive-wal.sh %p %f
    secrets:
    - eventos_db_password
    - replication_password
    volumes:
    - eventos_data:/var/lib/postgresql/data
    - eventos_wal:/var/lib/postgresql/archive
    healthcheck: *id002
    networks:
    - distributed
    restart: unless-stopped
    ports: []
  eventos:
    image: nexustix-distributed/eventos:auth
    build:
      context: .
      dockerfile: eventos/Dockerfile
    environment:
      DATABASE_URL_FILE: /run/secrets/eventos_database_url
      DB_APPLICATION_NAME: eventos
