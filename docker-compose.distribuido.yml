# Generado por scripts/generar_topologia.py; entorno NUEVO.
name: nexustix-distributed-lab
services:
  usuarios_db:
    image: nexustix-distributed/postgres:15
    build: &id001
      context: .
      dockerfile: postgres/Dockerfile
    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/usuarios_db_password
      NEXUSTIX_DEPLOYMENT_ENV: distributed
      NEXUSTIX_INIT_REPLICATION: '1'
      NEXUSTIX_REPLICA_SLOT: usuarios_db_replica
      NEXUSTIX_REPLICATION_PASSWORD_FILE: /run/secrets/replication_password
    command:
    - postgres
    - -c
    - tcp_keepalives_idle=10
    - -c
    - tcp_keepalives_interval=5
    - -c
    - tcp_keepalives_count=3
    - -c
    - idle_in_transaction_session_timeout=120s
    - -c
    - wal_level=replica
    - -c
    - max_wal_senders=10
    - -c
    - max_replication_slots=10
    - -c
    - max_slot_wal_keep_size=1024MB
    - -c
    - wal_log_hints=on
    - -c
    - checkpoint_timeout=5min
    - -c
    - archive_mode=on
    - -c
    - archive_timeout=60s
    - -c
    - archive_command=archive-wal.sh %p %f
    secrets:
    - usuarios_db_password
    - replication_password
    volumes:
    - usuarios_data:/var/lib/postgresql/data
    - usuarios_wal:/var/lib/postgresql/archive
    healthcheck: &id002
      test:
      - CMD
      - nexustix-healthcheck.sh
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
    - distributed
    restart: unless-stopped
    ports: []
  usuarios:
    image: nexustix-distributed/usuarios:auth
    build:
      context: .
      dockerfile: usuarios/Dockerfile
    environment:
      DATABASE_URL_FILE: /run/secrets/usuarios_database_url
      DB_APPLICATION_NAME: usuarios
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public
      FRONTEND_ORIGINS: http://localhost:28080,http://127.0.0.1:28080
      AUTH_COOKIE_SECURE: 'false'
      ACCESS_TOKEN_TTL_SECONDS: '600'
      REFRESH_TOKEN_TTL_DAYS: '1'
      NEXUSTIX_DEPLOYMENT_ENV: distributed
    secrets:
    - usuarios_database_url
    - jwt_private
    - jwt_public
    - admin_password
    ports:
    - 127.0.0.1:28081:8001
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      test:
      - CMD
      - python
      - -m
      - shared.healthcheck
      - http://127.0.0.1:8001/health
    depends_on:
      usuarios_db:
        condition: service_healthy
    networks:
    - distributed
    restart: unless-stopped
  eventos_db:
    image: nexustix-distributed/postgres:15
    build: *id001
    environment:
      POSTGRES_DB: eventos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/eventos_db_password
      NEXUSTIX_DEPLOYMENT_ENV: distributed
