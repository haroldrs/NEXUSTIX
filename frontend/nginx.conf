# Frontend estático de NEXUSTIX (mismo archivo para demo y pruebas).
#
# config.js se toma del secreto "frontend_config" que genera
# scripts/generar_secretos.py para cada entorno (URLs de las APIs). Si el
# secreto no está montado se sirve el config.js por defecto de la imagen
# (APIs en localhost:8001-8005).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","servicio":"frontend"}';
    }

    location = /config.js {
        root /run/secrets;
        default_type application/javascript;
        add_header Cache-Control "no-store";
        try_files /frontend_config @config_por_defecto;
    }

    location @config_por_defecto {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    location = /app.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
