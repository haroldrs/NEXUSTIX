# PLANTILLA INACTIVA de HAProxy en el host. El certificado lo emite una CA para tu dominio
# y queda fuera del repositorio. No usar certificados de demostración en producción.
defaults
    mode http
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    retries 0

frontend http_publico
    bind :80
    http-request redirect scheme https code 301

frontend https_publico
    bind :443 ssl crt /ruta/fuera/del/repositorio/certificado.pem
    # El cliente no decide estas cabeceras: se descartan y las fija el proxy.
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    http-request set-header X-Forwarded-Proto https
    http-response set-header Strict-Transport-Security "max-age=31536000"
    # Rutas exclusivas entre servicios: nunca desde Internet.
    http-request deny deny_status 404 if { path_beg /interno/ }
    use_backend usuarios if { hdr(host) -i usuarios.CAMBIAR_DOMINIO }
    use_backend eventos if { hdr(host) -i eventos.CAMBIAR_DOMINIO }
    use_backend compras if { hdr(host) -i compras.CAMBIAR_DOMINIO }
    default_backend portal

backend portal
    server local 127.0.0.1:8080 check
backend usuarios
    server local 127.0.0.1:8001 check
backend eventos
    server local 127.0.0.1:8002 check
backend compras
    server local 127.0.0.1:8005 check
