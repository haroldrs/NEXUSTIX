# LAN nueva; PostgreSQL centralizado; no desplegado.
name: nexustix-lan-${LAN_DEPLOYMENT_ID:?Defina LAN_DEPLOYMENT_ID}-pc1
services:
  compras:
    restart: unless-stopped
    labels: &id001
      org.nexustix.installation: ${LAN_INSTALLATION_UUID:?Defina LAN_INSTALLATION_UUID}
      org.nexustix.role: pc1
    networks:
    - lan
    image: nexustix-lan/${LAN_DEPLOYMENT_ID:?Defina LAN_DEPLOYMENT_ID}-compras:local
    build:
      context: ..
      dockerfile: compras/Dockerfile
    environment:
      DATABASE_URL_FILE: /run/secrets/compras_database_url
      DB_APPLICATION_NAME: compras-pc1
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public
      FRONTEND_ORIGINS: http://${LAN_PC1_IP:?Defina LAN_PC1_IP}:${LAN_FRONTEND_PORT:?Defina
        LAN_FRONTEND_PORT}
      NEXUSTIX_DEPLOYMENT_ENV: lan
      INSTANCE_ID: '1'
      EVENTOS_SERVICE_TOKEN_FILE: /run/secrets/eventos_service_token
      EVENTOS_URL: http://${LAN_PC1_IP:?Defina LAN_PC1_IP}:${LAN_EVENTOS_PORT:?Defina
        LAN_EVENTOS_PORT}
      PUBLIC_PORTAL_URL: http://${LAN_PC1_IP:?Defina LAN_PC1_IP}:${LAN_FRONTEND_PORT:?Defina LAN_FRONTEND_PORT}
      PURCHASE_RECOVERY_INTERVAL_SECONDS: '10'
      PURCHASE_RECOVERY_AUTO_RELEASE: '0'
      NEXUSTIX_TEST_CRASH_HOOKS: '0'
    secrets:
    - compras_database_url
    - jwt_public
    - eventos_service_token
    ports:
    - ${LAN_BIND_IP:?Defina LAN_BIND_IP}:${LAN_COMPRAS_PORT:?Defina LAN_COMPRAS_PORT}:8003
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - shared.healthcheck
      - http://127.0.0.1:8003/health
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 60s
  gateway:
    restart: unless-stopped
    labels: *id001
    networks:
    - lan
    image: haproxy:3.0-alpine
    volumes:
    - ${LAN_CONFIG_DIR:?Defina LAN_CONFIG_DIR}/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,Z
    ports:
    - ${LAN_BIND_IP:?Defina LAN_BIND_IP}:${LAN_USUARIOS_PORT:?Defina LAN_USUARIOS_PORT}:${LAN_USUARIOS_PORT:?Defina
      LAN_USUARIOS_PORT}
    - ${LAN_BIND_IP:?Defina LAN_BIND_IP}:${LAN_EVENTOS_PORT:?Defina LAN_EVENTOS_PORT}:${LAN_EVENTOS_PORT:?Defina
      LAN_EVENTOS_PORT}
    - ${LAN_BIND_IP:?Defina LAN_BIND_IP}:${LAN_BALANCER_PORT:?Defina LAN_BALANCER_PORT}:${LAN_BALANCER_PORT:?Defina
      LAN_BALANCER_PORT}
    healthcheck:
      test:
      - CMD
      - haproxy
      - -c
      - -f
      - /usr/local/etc/haproxy/haproxy.cfg
      interval: 10s
      timeout: 4s
      retries: 3
  frontend:
    restart: unless-stopped
    labels: *id001
    networks:
    - lan
    image: nexustix-lan/${LAN_DEPLOYMENT_ID:?Defina LAN_DEPLOYMENT_ID}-frontend:local
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    secrets:
    - frontend_config
    ports:
    - ${LAN_BIND_IP:?Defina LAN_BIND_IP}:${LAN_FRONTEND_PORT:?Defina LAN_FRONTEND_PORT}:80
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1/health || exit 1
      interval: 5s
      timeout: 4s
      retries: 5
networks:
  lan:
    name: nexustix-lan-${LAN_DEPLOYMENT_ID:?Defina LAN_DEPLOYMENT_ID}-pc1_network
    labels: *id001
secrets:
  compras_database_url:
    file: ${LAN_SECRETS_DIR:?Defina LAN_SECRETS_DIR}/compras-database-url
  jwt_public:
    file: ${LAN_SECRETS_DIR:?Defina LAN_SECRETS_DIR}/jwt-public.pem
  eventos_service_token:
    file: ${LAN_SECRETS_DIR:?Defina LAN_SECRETS_DIR}/eventos-service-token
  frontend_config:
    file: ${LAN_SECRETS_DIR:?Defina LAN_SECRETS_DIR}/frontend-config.js
