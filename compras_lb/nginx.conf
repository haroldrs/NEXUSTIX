# Balanceador de carga para el servicio de Compras (compras1 y compras2).
#
# Qué garantiza y qué no:
# - Reparte las peticiones en round robin entre las dos réplicas.
# - "resolve" + resolver de Docker: los nombres compras1/compras2 se vuelven a
#   resolver cada pocos segundos. Nginx arranca aunque una réplica esté
#   detenida y detecta la nueva IP si el contenedor se recrea.
# - Failover pasivo: si una réplica rechaza la conexión, agota el tiempo o
#   responde 502/503/504, la petición se reenvía UNA vez a la otra réplica y la
#   réplica fallida queda fuera de rotación durante fail_timeout.
# - Nginx OSS no tiene health checks activos: una réplica caída se detecta con
#   la primera petición que falla contra ella (que se reenvía a la otra).
#
# Reintentos y efectos secundarios:
# - Por defecto Nginx NO reenvía un POST que ya llegó a una réplica.
# - Solo POST /compras se marca "non_idempotent": el backend exige
#   Idempotency-Key y la reclama en PostgreSQL compartido con bloqueo de fila
#   antes de tocar Eventos. Reenviar la misma petición (misma clave y cuerpo)
#   a la otra réplica reanuda la misma operacion_id o devuelve la respuesta
#   guardada; nunca crea una segunda compra.
# - /compras/grupal, /compras/recuperar-servidor y /simulador/* no se
#   reenvían tras haber llegado a una réplica.

resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream compras_backend {
    zone compras_backend 64k;
    server compras1:8003 max_fails=1 fail_timeout=10s resolve;
    server compras2:8003 max_fails=1 fail_timeout=10s resolve;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 64k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;

    # Compras puede tardar hasta ~20 s en el peor caso (reserva + consulta
    # durable + confirmación contra Eventos con timeout de 5 s cada una).
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 25s;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 30s;

    # Réplica que atendió la petición (útil para pruebas y demostración).
    add_header X-Nexustix-Upstream $upstream_addr always;

    # Salud del propio balanceador (no consulta las réplicas).
    location = /lb-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","servicio":"compras_lb"}';
    }

    # Compra individual: idempotente por Idempotency-Key (ver cabecera).
    location = /compras {
        proxy_pass http://compras_backend;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    }

    location / {
        proxy_pass http://compras_backend;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
