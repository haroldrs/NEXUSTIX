[pytest]
minversion = 8.0
addopts = -ra -p no:cacheprovider
# Lista explícita: añadir pruebas nuevas solo tras revisar sus efectos.
testpaths =
    tests/test_authentication.py
    tests/test_backup_procedure.py
    tests/test_locust_safety.py
    tests/test_recuperacion_automatica.py
    tests/test_eventos_inventario.py
    tests/test_migraciones.py
    tests/test_configuracion.py
    tests/test_operaciones.py
    tests/test_distribuido_config.py
    tests/test_coordinacion.py
    tests/test_alta_disponibilidad.py
    tests/vm
    tests/lan
norecursedirs = .git .venv resultados legacy
